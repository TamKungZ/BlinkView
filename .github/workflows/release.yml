name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            rpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Package Linux
        run: sh scripts/package-linux.sh

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: blinkview-linux-packages
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install packaging tools
        shell: pwsh
        run: |
          dotnet tool install --global wix
          choco install innosetup --no-progress -y

      - name: Test
        run: cargo test

      - name: Package Windows
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: blinkview-windows-packages
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Package macOS
        run: sh scripts/package-macos.sh

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: blinkview-macos-packages
          path: dist/*

  publish:
    runs-on: ubuntu-latest
    needs: [linux, windows, macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Extract release notes
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          fi

          awk -v version="$VERSION" '
            $0 == "## " version { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [[ ! -s RELEASE_NOTES.md ]]; then
            {
              echo "## $VERSION"
              echo
              echo "No changelog entry found for $VERSION."
            } > RELEASE_NOTES.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          body_path: RELEASE_NOTES.md
          draft: ${{ github.event_name == 'workflow_dispatch' }}
