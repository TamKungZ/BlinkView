name: build

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test

      - name: Build release
        run: cargo build --release

      - name: Upload Linux/macOS binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: blinkview-${{ runner.os }}
          path: target/release/blinkview

      - name: Upload Windows binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: blinkview-Windows
          path: target/release/blinkview.exe
